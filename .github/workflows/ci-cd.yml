name: CI/CD - Movie App (CRA + TS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      #  dependencies
      - name: Install dependencies
        run: npm ci

      #  Lint
      - name: Run lint
        run: npm run lint || true

      - name: Run tests
        run: echo "Skipping tests for CI/CD"

      #  Build
      - name: Build project
        run: npm run build

      #    GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
